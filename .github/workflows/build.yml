name: Build Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse: true

      - name: Set up sparse checkout
        run: |
          git sparse-checkout set \
            build_files \
            release/datafiles \
            source/blender \
            source/creator/CMakeLists.txt \
            CMakeLists.txt \
            .gitmodules \
            assets \
            scripts

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build git python3 python3-pip python3-venv \
            openjdk-17-jdk-headless unzip patchelf wget curl

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          emulator: false

      - name: Build Blender for Android
        env:
          BLENDER_ANDROID_CONFIG: full
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd build_files/android
          ./build.sh

      - name: Package APK
        env:
          BLENDER_ANDROID_CONFIG: full
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          cd build_files/android/apk
          ./package.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-apk
          path: "**/blender-*.apk"
          retention-days: 7